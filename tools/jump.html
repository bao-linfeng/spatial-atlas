<!doctype html>
<!-- 开发辅助：检测车流异常（瞬移、横移、原地调头，见 carcheck.js），结果写入 #out。?park=sunan -->
<meta charset="utf-8">
<iframe id="f" style="width:800px;height:500px;border:0"></iframe>
<pre id="out">running</pre>
<script type="module">
import { checkCars } from './carcheck.js';
document.getElementById('f').src = `../parks/${new URLSearchParams(location.search).get('park') || 'sunan'}/`;
const iv = setInterval(() => {
  const p = document.getElementById('f').contentWindow.__park;
  if (!p) return;
  clearInterval(iv);
  document.getElementById('out').textContent = 'DONE ' + p.W.cars.count + ' ' + JSON.stringify(checkCars(p.W));
}, 100);
</script>
