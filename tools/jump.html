<!doctype html>
<!-- 开发辅助：检测车辆在沙盘内部的瞬移（消失点），结果写入 #out。?park=sunan -->
<meta charset="utf-8">
<iframe id="f" style="width:800px;height:500px;border:0"></iframe>
<pre id="out">running</pre>
<script>
document.getElementById('f').src = `../parks/${new URLSearchParams(location.search).get('park') || 'sunan'}/`;
const iv = setInterval(() => {
  const w = document.getElementById('f').contentWindow, p = w.__park;
  if (!p) return;
  clearInterval(iv);
  const { cars, plateRect: r } = p.W, body = cars.group.children[0], a = body.instanceMatrix.array;
  const n = body.count, prev = new Float32Array(n * 3), hits = {};
  const snap = () => { for (let i = 0; i < n; i++) prev.set([a[i * 16 + 12], a[i * 16 + 13], a[i * 16 + 14]], i * 3); };
  const edge = (x, z) => Math.min(x - r.x0, r.x1 - x, z - r.z0, r.z1 - z) < 25;
  snap();
  for (let k = 0; k < 6000; k++) {
    cars.update(0.05);
    for (let i = 0; i < n; i++) {
      const x0 = prev[i * 3], z0 = prev[i * 3 + 2], x1 = a[i * 16 + 12], z1 = a[i * 16 + 14];
      if (Math.hypot(x1 - x0, z1 - z0) > 6) {
        for (const [x, z] of [[x0, z0], [x1, z1]]) if (!edge(x, z)) {
          const key = `${Math.round(x / 20) * 20},${Math.round(z / 20) * 20}`; hits[key] = (hits[key] || 0) + 1;
        }
      }
    }
    snap();
  }
  document.getElementById('out').textContent = 'DONE ' + n + ' ' + JSON.stringify(hits);
}, 100);
</script>
