<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>空间档案 · SPATIAL ATLAS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%231d5149'/%3E%3Cpath d='M10 28V16l10-6 10 6v12l-10 6zM10 16l10 6 10-6M20 22v12' fill='none' stroke='%23e9f0d5' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./home/home.css">
</head>
<body>
  <header class="masthead">
    <a class="brand" href="./" aria-label="空间档案首页">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="m16 3 12 7v13l-12 7-12-7V10Zm0 14 12-7M16 17 4 10m12 7v13" stroke="currentColor" stroke-width="1.5"/></svg>
      <span>空间档案<small>SPATIAL ATLAS</small></span>
    </a>
    <p class="plate-no">图版 · 常州 <span>PLATE CHANGZHOU</span></p>
  </header>

  <main class="atlas">
    <section class="map" aria-label="常州园区分布图">
      <div class="map-title" aria-hidden="true">
        <h1>常州</h1>
        <p>CHANGZHOU · 江苏<br>园区三维沙盘分布</p>
      </div>
      <svg id="map" role="img" aria-labelledby="map-desc"><desc id="map-desc">常州市区县边界与已收录园区位置</desc></svg>
      <p id="map-missing" class="map-missing" hidden>缺少区县边界数据 <code>home/changzhou.json</code>，暂以目录形式浏览。</p>
      <p id="readout" class="readout" aria-hidden="true"></p>
    </section>

    <aside class="index" aria-labelledby="index-title">
      <header>
        <h2 id="index-title">图版目录<span>INDEX</span></h2>
        <p id="count"></p>
      </header>
      <ol id="parks"></ol>
      <footer>
        <p>区县边界：DataV.GeoAtlas（高德坐标）。园区位置为示意，沙盘内容以各园区「建模说明」为准。</p>
      </footer>
    </aside>
  </main>

  <script type="module" src="./home/home.js"></script>
</body>
</html>
